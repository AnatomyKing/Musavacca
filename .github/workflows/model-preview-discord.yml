name: Preview model changes in Discord

on:
  push:
    paths:
      - 'src/main/resources/assets/**/models/item/**/*.json'
      - 'src/main/resources/assets/**/models/block/**/*.json'
      - 'src/main/resources/assets/**/blockstates/**/*.json'
      - 'src/main/resources/assets/**/textures/**/*.png'
      - 'src/main/resources/assets/**/textures/**/*.jpg'
      - 'src/main/resources/assets/**/textures/**/*.jpeg'
      - 'src/main/resources/assets/**/textures/**/*.webp'
      - 'src/main/resources/assets/**/*.mcmeta'
      - 'versions/*/src/generated/resources/assets/**/models/item/**/*.json'
      - 'versions/*/src/generated/resources/assets/**/models/block/**/*.json'
      - 'versions/*/src/generated/resources/assets/**/blockstates/**/*.json'
      - 'versions/*/src/generated/resources/assets/**/textures/**/*.png'
      - 'versions/*/src/generated/resources/assets/**/textures/**/*.jpg'
      - 'versions/*/src/generated/resources/assets/**/textures/**/*.jpeg'
      - 'versions/*/src/generated/resources/assets/**/textures/**/*.webp'
      - 'versions/*/src/generated/resources/assets/**/*.mcmeta'
      - '.github/renderer-runner/**'
      - '.github/vendor/minecraft-model-renderer.tgz'
      - '.github/workflows/model-preview-discord.yml'

permissions:
  contents: read

concurrency:
  group: preview-model-changes-${{ github.ref }}
  cancel-in-progress: true

jobs:
  notify-discord:
    runs-on: ubuntu-latest
    env:
      DISCORD_WEBHOOK: ${{ secrets.DISCORD_WEBHOOK }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install native system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            python3 \
            make \
            g++ \
            pkg-config \
            xvfb \
            libx11-6 \
            libxext6 \
            libxi6 \
            libxrender1 \
            libxrandr2 \
            libxxf86vm1 \
            libxcursor1 \
            libgl1-mesa-dri \
            libgl1-mesa-dev \
            libegl1-mesa-dev \
            libgles2-mesa-dev \
            libcairo2-dev \
            libpango1.0-dev \
            libjpeg-dev \
            libgif-dev \
            librsvg2-dev

      - name: Restore cached renderer runner
        id: cache-runner
        uses: actions/cache@v4
        with:
          path: .github/renderer-runner/node_modules
          key: ${{ runner.os }}-renderer-runner-${{ hashFiles('.github/renderer-runner/package-lock.json', '.github/vendor/minecraft-model-renderer.tgz') }}

      - name: Install renderer runner dependencies
        if: steps.cache-runner.outputs.cache-hit != 'true'
        working-directory: .github/renderer-runner
        run: npm ci

      - name: Resolve changed render targets
        id: detect
        shell: bash
        env:
          GITHUB_EVENT_BEFORE: ${{ github.event.before }}
          GITHUB_SHA: ${{ github.sha }}
        run: |
          node <<'NODE'
          const fs = require("fs");
          const path = require("path");
          const cp = require("child_process");

          function normalize(p) {
            return p.replace(/\\/g, "/");
          }

          function exists(p) {
            return fs.existsSync(p);
          }

          const outputPath = process.env.GITHUB_OUTPUT;

          function setOutput(name, value) {
            fs.appendFileSync(outputPath, `${name}=${value}\n`);
          }

          const before = process.env.GITHUB_EVENT_BEFORE || "";
          const sha = process.env.GITHUB_SHA;

          let base = before;
          if (!base || /^0+$/.test(base)) {
            try {
              base = cp.execSync("git rev-parse HEAD^", { encoding: "utf8" }).trim();
            } catch {
              base = "";
            }
          }

          const changedFiles = (
            base
              ? cp.execSync(`git diff --name-only ${base} ${sha}`, { encoding: "utf8" })
              : cp.execSync("git ls-files", { encoding: "utf8" })
          )
            .split(/\r?\n/)
            .map(normalize)
            .filter(Boolean);

          const assetRoots = [];
          const mainRoot = "src/main/resources/assets";
          if (exists(mainRoot)) assetRoots.push(normalize(mainRoot));

          if (exists("versions")) {
            for (const versionDir of fs.readdirSync("versions", { withFileTypes: true })) {
              if (!versionDir.isDirectory()) continue;
              const root = normalize(
                path.join("versions", versionDir.name, "src/generated/resources/assets")
              );
              if (exists(root)) assetRoots.push(root);
            }
          }

          function walkFiles(dir, predicate, result = []) {
            if (!exists(dir)) return result;

            for (const entry of fs.readdirSync(dir, { withFileTypes: true })) {
              const full = path.join(dir, entry.name);
              if (entry.isDirectory()) {
                walkFiles(full, predicate, result);
              } else if (entry.isFile()) {
                const normalized = normalize(full);
                if (predicate(normalized)) {
                  result.push(normalized);
                }
              }
            }

            return result;
          }

          const rootSet = new Set(assetRoots);
          const modelIds = new Set();
          const blockstateIds = new Set();
          const changedTextureRefs = new Set();
          const changedModelRefs = new Set();

          function findAssetRoot(file) {
            const normalized = normalize(file);
            for (const root of rootSet) {
              if (normalized === root || normalized.startsWith(root + "/")) {
                return root;
              }
            }
            return null;
          }

          function relativeToRoot(file, root) {
            return normalize(path.relative(root, file));
          }

          function maybeAddDirectTarget(file) {
            const root = findAssetRoot(file);
            if (!root) return;

            const rel = relativeToRoot(file, root);

            let m = rel.match(/^([^/]+)\/models\/item\/(.+)\.json$/i);
            if (m) {
              const id = `${m[1]}:item/${m[2]}`;
              modelIds.add(id);
              changedModelRefs.add(id);
              return;
            }

            m = rel.match(/^([^/]+)\/models\/block\/(.+)\.json$/i);
            if (m) {
              changedModelRefs.add(`${m[1]}:block/${m[2]}`);
              return;
            }

            m = rel.match(/^([^/]+)\/blockstates\/(.+)\.json$/i);
            if (m) {
              blockstateIds.add(`${m[1]}:${m[2]}`);
              return;
            }

            m = rel.match(/^([^/]+)\/textures\/(.+)\.(png|jpg|jpeg|webp)(?:\.mcmeta)?$/i);
            if (m) {
              changedTextureRefs.add(`${m[1]}:${m[2]}`);
            }
          }

          for (const file of changedFiles) {
            maybeAddDirectTarget(file);
          }

          const allItemModelJsonFiles = assetRoots.flatMap((root) =>
            walkFiles(root, (file) => /\/models\/item\/.+\.json$/i.test(file))
          );

          const allBlockModelJsonFiles = assetRoots.flatMap((root) =>
            walkFiles(root, (file) => /\/models\/block\/.+\.json$/i.test(file))
          );

          const allBlockstateJsonFiles = assetRoots.flatMap((root) =>
            walkFiles(root, (file) => /\/blockstates\/.+\.json$/i.test(file))
          );

          if (changedTextureRefs.size > 0) {
            const refs = [...changedTextureRefs];

            for (const file of allItemModelJsonFiles) {
              const raw = fs.readFileSync(file, "utf8");
              if (!refs.some((ref) => raw.includes(ref))) continue;

              const root = findAssetRoot(file);
              if (!root) continue;

              const rel = relativeToRoot(file, root);
              const m = rel.match(/^([^/]+)\/models\/item\/(.+)\.json$/i);
              if (!m) continue;

              const id = `${m[1]}:item/${m[2]}`;
              modelIds.add(id);
              changedModelRefs.add(id);
            }

            for (const file of allBlockModelJsonFiles) {
              const raw = fs.readFileSync(file, "utf8");
              if (!refs.some((ref) => raw.includes(ref))) continue;

              const root = findAssetRoot(file);
              if (!root) continue;

              const rel = relativeToRoot(file, root);
              const m = rel.match(/^([^/]+)\/models\/block\/(.+)\.json$/i);
              if (!m) continue;

              changedModelRefs.add(`${m[1]}:block/${m[2]}`);
            }
          }

          if (changedModelRefs.size > 0) {
            const refs = [...changedModelRefs];

            for (const file of allItemModelJsonFiles) {
              const raw = fs.readFileSync(file, "utf8");
              if (!refs.some((ref) => raw.includes(ref))) continue;

              const root = findAssetRoot(file);
              if (!root) continue;

              const rel = relativeToRoot(file, root);
              const m = rel.match(/^([^/]+)\/models\/item\/(.+)\.json$/i);
              if (!m) continue;

              modelIds.add(`${m[1]}:item/${m[2]}`);
            }

            for (const file of allBlockstateJsonFiles) {
              const raw = fs.readFileSync(file, "utf8");
              if (!refs.some((ref) => raw.includes(ref))) continue;

              const root = findAssetRoot(file);
              if (!root) continue;

              const rel = relativeToRoot(file, root);
              const m = rel.match(/^([^/]+)\/blockstates\/(.+)\.json$/i);
              if (!m) continue;

              blockstateIds.add(`${m[1]}:${m[2]}`);
            }
          }

          const assetRootList = [...assetRoots];
          const modelIdList = [...modelIds].sort();
          const blockstateIdList = [...blockstateIds].sort();
          const hasTargets = modelIdList.length > 0 || blockstateIdList.length > 0;

          console.log("Changed files:");
          for (const file of changedFiles) console.log(`  - ${file}`);

          console.log("Asset roots:");
          for (const root of assetRootList) console.log(`  - ${root}`);

          console.log("Model IDs:");
          for (const id of modelIdList) console.log(`  - ${id}`);

          console.log("Blockstate IDs:");
          for (const id of blockstateIdList) console.log(`  - ${id}`);

          setOutput("has_targets", hasTargets ? "true" : "false");
          setOutput("asset_roots_json", JSON.stringify(assetRootList));
          setOutput("model_ids_json", JSON.stringify(modelIdList));
          setOutput("blockstate_ids_json", JSON.stringify(blockstateIdList));
          setOutput("model_count", String(modelIdList.length));
          setOutput("blockstate_count", String(blockstateIdList.length));
          NODE

      - name: Stop early when nothing relevant remains
        if: steps.detect.outputs.has_targets != 'true'
        run: echo "No renderable model or blockstate targets were found for this push."

      - name: Render and send GIF batches to Discord
        if: steps.detect.outputs.has_targets == 'true'
        shell: bash
        env:
          ASSET_ROOTS_JSON: ${{ steps.detect.outputs.asset_roots_json }}
          MODEL_IDS_JSON: ${{ steps.detect.outputs.model_ids_json }}
          BLOCKSTATE_IDS_JSON: ${{ steps.detect.outputs.blockstate_ids_json }}
        run: |
          set -euo pipefail

          SAFE_MAX_BYTES=9500000
          FIXED_IMAGE_SIZE=128
          FIXED_FRAME_COUNT=36
          FIXED_MAX_COLUMNS=5
          FIXED_FRAME_DELAY_MS=60

          WORK_DIR="$RUNNER_TEMP/model-preview-work"
          OUTPUT_DIR="$RUNNER_TEMP/rendered-gifs"
          mkdir -p "$WORK_DIR" "$OUTPUT_DIR"

          export WORK_DIR
          export OUTPUT_DIR
          export SAFE_MAX_BYTES
          export FIXED_IMAGE_SIZE
          export FIXED_FRAME_COUNT
          export FIXED_MAX_COLUMNS
          export FIXED_FRAME_DELAY_MS
          export ASSET_ROOTS_JSON
          export MODEL_IDS_JSON
          export BLOCKSTATE_IDS_JSON

          printf '%s\n' "$(python3 - <<'PY'
          import json, os
          for root in json.loads(os.environ["ASSET_ROOTS_JSON"]):
              print(root)
          PY
          )" > "$WORK_DIR/asset-roots.txt"

          printf '%s' "${MODEL_IDS_JSON}" > "$WORK_DIR/items_remaining.json"
          printf '%s' "${BLOCKSTATE_IDS_JSON}" > "$WORK_DIR/blockstates_remaining.json"

          RENDERER_CLI="$GITHUB_WORKSPACE/.github/renderer-runner/node_modules/minecraft-model-renderer/dist/lib/node/cli.js"

          if [ ! -f "$RENDERER_CLI" ]; then
            echo "Renderer CLI not found at: $RENDERER_CLI"
            exit 1
          fi

          json_count() {
            local json_file="$1"
            python3 - "$json_file" <<'PY'
          import json, sys
          with open(sys.argv[1], encoding="utf-8") as f:
              data = json.load(f)
          print(len(data))
          PY
          }

          json_take_prefix() {
            local source_json="$1"
            local take_count="$2"
            local out_json="$3"

            python3 - "$source_json" "$take_count" "$out_json" <<'PY'
          import json, sys
          source, take_count, out_path = sys.argv[1], int(sys.argv[2]), sys.argv[3]
          with open(source, encoding="utf-8") as f:
              data = json.load(f)
          with open(out_path, "w", encoding="utf-8") as f:
              json.dump(data[:take_count], f, ensure_ascii=False)
          PY
          }

          json_drop_prefix() {
            local source_json="$1"
            local drop_count="$2"
            local out_json="$3"

            python3 - "$source_json" "$drop_count" "$out_json" <<'PY'
          import json, sys
          source, drop_count, out_path = sys.argv[1], int(sys.argv[2]), sys.argv[3]
          with open(source, encoding="utf-8") as f:
              data = json.load(f)
          with open(out_path, "w", encoding="utf-8") as f:
              json.dump(data[drop_count:], f, ensure_ascii=False)
          PY
          }

          render_kind_batch() {
            local kind="$1"
            local ids_json="$2"
            local out_gif="$3"
            local ids_txt="$WORK_DIR/render_ids.txt"

            rm -f "$out_gif" "$ids_txt"

            python3 - "$ids_json" "$ids_txt" <<'PY'
          import json, sys
          ids_json_path, ids_txt_path = sys.argv[1], sys.argv[2]
          with open(ids_json_path, encoding="utf-8") as f:
              ids = json.load(f)
          with open(ids_txt_path, "w", encoding="utf-8") as f:
              if ids:
                  f.write("\n".join(ids) + "\n")
          PY

            ARGS=(
              render-queue
              --output "$out_gif"
              --image-size "$FIXED_IMAGE_SIZE"
              --frame-count "$FIXED_FRAME_COUNT"
              --max-columns "$FIXED_MAX_COLUMNS"
              --frame-delay-ms "$FIXED_FRAME_DELAY_MS"
            )

            while IFS= read -r root; do
              [ -n "${root:-}" ] || continue
              ARGS+=(--assets-root "$GITHUB_WORKSPACE/$root")
            done < "$WORK_DIR/asset-roots.txt"

            while IFS= read -r value; do
              [ -n "${value:-}" ] || continue

              if [ "$kind" = "items" ]; then
                ARGS+=(--model-id "$value")
              elif [ "$kind" = "blockstates" ]; then
                ARGS+=(--blockstate-id "$value")
              else
                echo "Unknown render kind: $kind"
                exit 1
              fi
            done < "$ids_txt"

            echo "Running renderer for $kind batch:"
            printf ' %q' node "$RENDERER_CLI" "${ARGS[@]}"
            printf '\n'

            xvfb-run -a -s "-ac -screen 0 1280x1024x24" \
              node "$RENDERER_CLI" "${ARGS[@]}"

            test -f "$out_gif"
          }

          upload_one() {
            local file_path="$1"
            local message_text="$2"

            FILE_TO_SEND="$file_path" MESSAGE_TEXT="$message_text" DISCORD_WEBHOOK="$DISCORD_WEBHOOK" node <<'EOF'
          const fs = require("fs");
          const https = require("https");
          const path = require("path");

          const webhook = (process.env.DISCORD_WEBHOOK || "").trim();
          const filePath = process.env.FILE_TO_SEND;
          const messageText = process.env.MESSAGE_TEXT || "";

          if (!webhook) {
            console.error("DISCORD_WEBHOOK secret is missing or empty");
            process.exit(1);
          }

          if (!filePath || !fs.existsSync(filePath)) {
            console.error("GIF file does not exist:", filePath);
            process.exit(1);
          }

          let webhookUrl;
          try {
            webhookUrl = new URL(webhook);
          } catch {
            console.error("DISCORD_WEBHOOK is not a valid URL");
            process.exit(1);
          }

          const attachmentName = path.basename(filePath);
          const gifBuffer = fs.readFileSync(filePath);
          const boundary = "----DiscordBoundary" + Math.random().toString(16).slice(2);

          const payload = JSON.stringify({
            content: messageText,
            allowed_mentions: { parse: [] }
          });

          const preamble =
            `--${boundary}\r\n` +
            `Content-Disposition: form-data; name="payload_json"\r\n` +
            `Content-Type: application/json\r\n\r\n` +
            payload + `\r\n` +
            `--${boundary}\r\n` +
            `Content-Disposition: form-data; name="files[0]"; filename="${attachmentName}"\r\n` +
            `Content-Type: image/gif\r\n\r\n`;

          const closing = `\r\n--${boundary}--\r\n`;

          const body = Buffer.concat([
            Buffer.from(preamble, "utf8"),
            gifBuffer,
            Buffer.from(closing, "utf8")
          ]);

          const options = {
            protocol: webhookUrl.protocol,
            hostname: webhookUrl.hostname,
            port: webhookUrl.port || (webhookUrl.protocol === "https:" ? 443 : 80),
            path: webhookUrl.pathname + webhookUrl.search,
            method: "POST",
            headers: {
              "Content-Type": `multipart/form-data; boundary=${boundary}`,
              "Content-Length": body.length
            }
          };

          const req = https.request(options, (res) => {
            let responseBody = "";
            res.on("data", chunk => responseBody += chunk);
            res.on("end", () => {
              if (res.statusCode >= 200 && res.statusCode < 300) {
                console.log(`Discord webhook sent successfully (${res.statusCode})`);
                process.exit(0);
              } else {
                console.error(`Discord webhook failed (${res.statusCode})`);
                console.error(responseBody);
                process.exit(1);
              }
            });
          });

          req.on("error", (err) => {
            console.error("Discord webhook request error:", err);
            process.exit(1);
          });

          req.write(body);
          req.end();
          EOF
          }

          send_text_only_notice() {
            local message_text="$1"

            MESSAGE_TEXT="$message_text" DISCORD_WEBHOOK="$DISCORD_WEBHOOK" node <<'EOF'
          const https = require("https");

          const webhook = (process.env.DISCORD_WEBHOOK || "").trim();
          const messageText = process.env.MESSAGE_TEXT || "";

          if (!webhook) {
            process.exit(0);
          }

          let webhookUrl;
          try {
            webhookUrl = new URL(webhook);
          } catch {
            console.error("DISCORD_WEBHOOK is not a valid URL");
            process.exit(1);
          }

          const payload = JSON.stringify({
            content: messageText,
            allowed_mentions: { parse: [] }
          });

          const req = https.request({
            protocol: webhookUrl.protocol,
            hostname: webhookUrl.hostname,
            port: webhookUrl.port || (webhookUrl.protocol === "https:" ? 443 : 80),
            path: webhookUrl.pathname + webhookUrl.search,
            method: "POST",
            headers: {
              "Content-Type": "application/json",
              "Content-Length": Buffer.byteLength(payload)
            }
          }, (res) => {
            let responseBody = "";
            res.on("data", chunk => responseBody += chunk);
            res.on("end", () => {
              if (res.statusCode >= 200 && res.statusCode < 300) {
                process.exit(0);
              } else {
                console.error(`Discord webhook text notice failed (${res.statusCode})`);
                console.error(responseBody);
                process.exit(1);
              }
            });
          });

          req.on("error", (err) => {
            console.error("Discord webhook text notice request error:", err);
            process.exit(1);
          });

          req.write(payload);
          req.end();
          EOF
          }

          find_largest_fitting_prefix() {
            local kind="$1"
            local remaining_json="$2"
            local label="$3"

            local total_count
            total_count=$(json_count "$remaining_json")

            if [ "$total_count" -le 0 ]; then
              echo "0|"
              return 0
            fi

            local full_gif="$WORK_DIR/${kind}_${label}_full.gif"
            render_kind_batch "$kind" "$remaining_json" "$full_gif"
            local full_size
            full_size=$(stat -c%s "$full_gif")

            echo "Full $kind batch attempt size: $full_size bytes"

            if [ "$full_size" -le "$SAFE_MAX_BYTES" ]; then
              echo "${total_count}|${full_gif}"
              return 0
            fi

            if [ "$total_count" -eq 1 ]; then
              echo "0|${full_gif}"
              return 0
            fi

            local low=1
            local high=$((total_count - 1))
            local best_count=0
            local best_gif=""

            while [ "$low" -le "$high" ]; do
              local mid=$(((low + high) / 2))
              local prefix_json="$WORK_DIR/${kind}_${label}_prefix_${mid}.json"
              local prefix_gif="$WORK_DIR/${kind}_${label}_prefix_${mid}.gif"

              json_take_prefix "$remaining_json" "$mid" "$prefix_json"
              render_kind_batch "$kind" "$prefix_json" "$prefix_gif"

              local prefix_size
              prefix_size=$(stat -c%s "$prefix_gif")

              echo "Tried $kind prefix size $mid => $prefix_size bytes"

              if [ "$prefix_size" -le "$SAFE_MAX_BYTES" ]; then
                best_count="$mid"
                best_gif="$prefix_gif"
                low=$((mid + 1))
              else
                high=$((mid - 1))
              fi
            done

            if [ "$best_count" -gt 0 ]; then
              echo "${best_count}|${best_gif}"
              return 0
            fi

            local single_json="$WORK_DIR/${kind}_${label}_single.json"
            local single_gif="$WORK_DIR/${kind}_${label}_single.gif"
            json_take_prefix "$remaining_json" 1 "$single_json"
            render_kind_batch "$kind" "$single_json" "$single_gif"
            echo "0|${single_gif}"
          }

          process_kind() {
            local kind="$1"
            local remaining_json="$2"

            local total_count
            total_count=$(json_count "$remaining_json")

            if [ "$total_count" -le 0 ]; then
              echo "No $kind targets to render."
              return 0
            fi

            local batch_index=1

            while true; do
              local current_count
              current_count=$(json_count "$remaining_json")

              if [ "$current_count" -le 0 ]; then
                break
              fi

              local label
              label=$(printf "%03d" "$batch_index")

              local result
              result=$(find_largest_fitting_prefix "$kind" "$remaining_json" "$label")

              local chosen_count="${result%%|*}"
              local chosen_gif="${result#*|}"

              if [ -z "$chosen_gif" ] || [ ! -f "$chosen_gif" ]; then
                echo "Failed to produce a GIF for $kind batch $label"
                exit 1
              fi

              local final_name="${kind}_${label}.gif"
              local final_path="$OUTPUT_DIR/$final_name"

              if [ "$chosen_count" -gt 0 ]; then
                local message_text="$kind preview batch $label (${chosen_count} target(s))"

                if [ -n "${DISCORD_WEBHOOK:-}" ]; then
                  upload_one "$chosen_gif" "$message_text"
                else
                  echo "DISCORD_WEBHOOK is empty, skipping Discord upload for $final_name"
                fi

                mv "$chosen_gif" "$final_path"

                local next_json="$WORK_DIR/${kind}_remaining_next.json"
                json_drop_prefix "$remaining_json" "$chosen_count" "$next_json"
                mv "$next_json" "$remaining_json"
              else
                echo "A single $kind target exceeded the Discord-safe size limit. Keeping it only as an artifact: $final_name"
                mv "$chosen_gif" "$final_path"

                if [ -n "${DISCORD_WEBHOOK:-}" ]; then
                  send_text_only_notice "$kind preview batch $label could not be uploaded because one GIF exceeded the Discord-safe size limit. It was kept as a GitHub artifact instead."
                fi

                local next_json="$WORK_DIR/${kind}_remaining_next.json"
                json_drop_prefix "$remaining_json" 1 "$next_json"
                mv "$next_json" "$remaining_json"
              fi

              batch_index=$((batch_index + 1))
            done
          }

          process_kind "items" "$WORK_DIR/items_remaining.json"
          process_kind "blockstates" "$WORK_DIR/blockstates_remaining.json"

          echo "Finished rendering all Discord-safe batches."
          ls -lah "$OUTPUT_DIR"

      - name: Upload rendered batch artifacts
        if: steps.detect.outputs.has_targets == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: model-preview-gifs
          path: ${{ runner.temp }}/rendered-gifs/*.gif
          if-no-files-found: error