name: Preview model changes in Discord

on:
  push:
    paths:
      - 'src/main/resources/assets/**/models/item/**/*.json'
      - 'src/main/resources/assets/**/blockstates/**/*.json'
      - 'versions/1.21.8/src/generated/resources/assets/**/models/item/**/*.json'
      - 'versions/1.21.8/src/generated/resources/assets/**/blockstates/**/*.json'

jobs:
  notify-discord:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install native system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            python3 \
            make \
            g++ \
            pkg-config \
            xvfb \
            libx11-6 \
            libxext6 \
            libxi6 \
            libgl1-mesa-dri \
            libgl1-mesa-dev \
            libegl1-mesa-dev \
            libgles2-mesa-dev \
            libcairo2-dev \
            libpango1.0-dev \
            libjpeg-dev \
            libgif-dev \
            librsvg2-dev

      - name: Detect changed direct item models and blockstates
        id: detect
        env:
          BEFORE_SHA: ${{ github.event.before }}
          AFTER_SHA: ${{ github.sha }}
        run: |
          python <<'PY'
          import json
          import os
          import re
          import subprocess
          from pathlib import Path

          before = os.environ.get("BEFORE_SHA", "")
          after = os.environ["AFTER_SHA"]
          output_path = Path(os.environ["GITHUB_OUTPUT"])

          empty_tree = "4b825dc642cb6eb9a060e54bf8d69288fbee4904"
          base = empty_tree if (not before or set(before) == {"0"}) else before

          diff = subprocess.check_output(
              ["git", "diff", "--name-status", base, after],
              text=True
          )

          model_patterns = [
              re.compile(r"^src/main/resources/assets/([^/]+)/models/item/(.+)\.json$"),
              re.compile(r"^versions/1\.21\.8/src/generated/resources/assets/([^/]+)/models/item/(.+)\.json$"),
          ]

          blockstate_patterns = [
              re.compile(r"^src/main/resources/assets/([^/]+)/blockstates/(.+)\.json$"),
              re.compile(r"^versions/1\.21\.8/src/generated/resources/assets/([^/]+)/blockstates/(.+)\.json$"),
          ]

          model_ids = []
          blockstate_ids = []
          seen_models = set()
          seen_blockstates = set()

          for raw_line in diff.splitlines():
              parts = raw_line.split("\t")
              if not parts:
                  continue

              status = parts[0]

              if status.startswith("D"):
                  continue

              if (status.startswith("R") or status.startswith("C")) and len(parts) >= 3:
                  path = parts[2]
              elif len(parts) >= 2:
                  path = parts[1]
              else:
                  continue

              path = path.replace("\\", "/")

              if not os.path.exists(path):
                  continue

              matched = False

              for pattern in model_patterns:
                  m = pattern.match(path)
                  if m:
                      model_id = f"{m.group(1)}:item/{m.group(2)}"
                      if model_id not in seen_models:
                          seen_models.add(model_id)
                          model_ids.append(model_id)
                      matched = True
                      break

              if matched:
                  continue

              for pattern in blockstate_patterns:
                  m = pattern.match(path)
                  if m:
                      blockstate_id = f"{m.group(1)}:{m.group(2)}"
                      if blockstate_id not in seen_blockstates:
                          seen_blockstates.add(blockstate_id)
                          blockstate_ids.append(blockstate_id)
                      break

          has_targets = "true" if (model_ids or blockstate_ids) else "false"

          with output_path.open("a", encoding="utf-8") as f:
              f.write(f"has_targets={has_targets}\n")
              f.write(f"model_ids_json={json.dumps(model_ids, ensure_ascii=False)}\n")
              f.write(f"blockstate_ids_json={json.dumps(blockstate_ids, ensure_ascii=False)}\n")
              f.write(f"model_count={len(model_ids)}\n")
              f.write(f"blockstate_count={len(blockstate_ids)}\n")

          print("Detected model ids:", model_ids)
          print("Detected blockstate ids:", blockstate_ids)
          PY

      - name: Stop early when nothing relevant remains
        if: steps.detect.outputs.has_targets != 'true'
        run: echo "No added/modified/renamed direct item models or blockstates to render."

      - name: Restore cached renderer runner
        if: steps.detect.outputs.has_targets == 'true'
        id: cache-runner
        uses: actions/cache@v4
        with:
          path: .github/renderer-runner/node_modules
          key: ${{ runner.os }}-renderer-runner-${{ hashFiles('.github/renderer-runner/package-lock.json', '.github/vendor/item-model-renderer.tgz') }}

      - name: Install renderer runner dependencies
        if: steps.detect.outputs.has_targets == 'true' && steps.cache-runner.outputs.cache-hit != 'true'
        run: npm ci --prefix .github/renderer-runner

      - name: Render queue GIF
        if: steps.detect.outputs.has_targets == 'true'
        id: render
        env:
          MODEL_IDS_JSON: ${{ steps.detect.outputs.model_ids_json }}
          BLOCKSTATE_IDS_JSON: ${{ steps.detect.outputs.blockstate_ids_json }}
        run: |
          set -euo pipefail

          OUT_GIF="$RUNNER_TEMP/queue.gif"
          ARGS_FILE="$RUNNER_TEMP/render-args.txt"

          export OUT_GIF
          export ARGS_FILE

          python <<'PY'
          import json
          import os
          from pathlib import Path

          model_ids = json.loads(os.environ.get("MODEL_IDS_JSON", "[]"))
          blockstate_ids = json.loads(os.environ.get("BLOCKSTATE_IDS_JSON", "[]"))

          args = [
              "render-queue",
              "--assets-root", "src/main/resources/assets",
              "--assets-root", "versions/1.21.8/src/generated/resources/assets",
              "--output", os.environ["OUT_GIF"],
          ]

          for model_id in model_ids:
              if model_id:
                  args.extend(["--model-id", model_id])

          for blockstate_id in blockstate_ids:
              if blockstate_id:
                  args.extend(["--blockstate-id", blockstate_id])

          Path(os.environ["ARGS_FILE"]).write_text(
              "\n".join(args) + "\n",
              encoding="utf-8"
          )
          PY

          mapfile -t ARGS < "$ARGS_FILE"

          echo "Final renderer args:"
          printf '  %s\n' "${ARGS[@]}"

          FOUND_IDS=0
          for arg in "${ARGS[@]}"; do
            if [ "$arg" = "--model-id" ] || [ "$arg" = "--blockstate-id" ]; then
              FOUND_IDS=1
              break
            fi
          done

          if [ "$FOUND_IDS" -ne 1 ]; then
            echo "No --model-id or --blockstate-id flags were produced."
            exit 1
          fi

          xvfb-run -a -s "-ac -screen 0 1280x1024x24" \
            node ./.github/renderer-runner/node_modules/@iskallia-dev/item-model-renderer/dist/lib/node/cli.js "${ARGS[@]}"

          test -f "$OUT_GIF"
          echo "gif_path=$OUT_GIF" >> "$GITHUB_OUTPUT"

      - name: Send GIF to Discord with no text
        if: steps.detect.outputs.has_targets == 'true'
        env:
          DISCORD_WEBHOOK: ${{ secrets.DISCORD_WEBHOOK }}
          GIF_PATH: ${{ steps.render.outputs.gif_path }}
        run: |
          node <<'EOF'
          const fs = require('fs');
          const https = require('https');

          const webhook = (process.env.DISCORD_WEBHOOK || '').trim();
          const gifPath = process.env.GIF_PATH;

          if (!webhook) {
            console.error('DISCORD_WEBHOOK secret is missing or empty');
            process.exit(1);
          }

          if (!gifPath || !fs.existsSync(gifPath)) {
            console.error('GIF file does not exist:', gifPath);
            process.exit(1);
          }

          let webhookUrl;
          try {
            webhookUrl = new URL(webhook);
          } catch {
            console.error('DISCORD_WEBHOOK is not a valid URL');
            process.exit(1);
          }

          const gifBuffer = fs.readFileSync(gifPath);
          const boundary = '----DiscordBoundary' + Math.random().toString(16).slice(2);

          const payload = JSON.stringify({
            allowed_mentions: { parse: [] },
            embeds: [
              {
                image: {
                  url: 'attachment://queue.gif'
                }
              }
            ]
          });

          const preamble =
            `--${boundary}\r\n` +
            `Content-Disposition: form-data; name="payload_json"\r\n` +
            `Content-Type: application/json\r\n\r\n` +
            payload + `\r\n` +
            `--${boundary}\r\n` +
            `Content-Disposition: form-data; name="files[0]"; filename="queue.gif"\r\n` +
            `Content-Type: image/gif\r\n\r\n`;

          const closing = `\r\n--${boundary}--\r\n`;

          const body = Buffer.concat([
            Buffer.from(preamble, 'utf8'),
            gifBuffer,
            Buffer.from(closing, 'utf8')
          ]);

          const options = {
            protocol: webhookUrl.protocol,
            hostname: webhookUrl.hostname,
            port: webhookUrl.port || (webhookUrl.protocol === 'https:' ? 443 : 80),
            path: webhookUrl.pathname + webhookUrl.search,
            method: 'POST',
            headers: {
              'Content-Type': `multipart/form-data; boundary=${boundary}`,
              'Content-Length': body.length
            }
          };

          const req = https.request(options, (res) => {
            let responseBody = '';
            res.on('data', chunk => responseBody += chunk);
            res.on('end', () => {
              if (res.statusCode >= 200 && res.statusCode < 300) {
                console.log(`Discord webhook sent successfully (${res.statusCode})`);
                process.exit(0);
              } else {
                console.error(`Discord webhook failed (${res.statusCode})`);
                console.error(responseBody);
                process.exit(1);
              }
            });
          });

          req.on('error', (err) => {
            console.error('Discord webhook request error:', err);
            process.exit(1);
          });

          req.write(body);
          req.end();
          EOF