name: Preview model changes in Discord

on:
  push:
    paths:
      - 'src/main/resources/assets/**/models/item/**/*.json'
      - 'src/main/resources/assets/**/blockstates/**/*.json'
      - 'versions/1.21.8/src/generated/resources/assets/**/models/item/**/*.json'
      - 'versions/1.21.8/src/generated/resources/assets/**/blockstates/**/*.json'

jobs:
  notify-discord:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Detect changed direct item models and blockstates
        id: detect
        env:
          BEFORE_SHA: ${{ github.event.before }}
          AFTER_SHA: ${{ github.sha }}
        run: |
          python <<'PY'
          import os
          import re
          import subprocess
          from pathlib import Path

          before = os.environ.get("BEFORE_SHA", "")
          after = os.environ["AFTER_SHA"]
          runner_temp = Path(os.environ["RUNNER_TEMP"])
          output_path = Path(os.environ["GITHUB_OUTPUT"])

          empty_tree = "4b825dc642cb6eb9a060e54bf8d69288fbee4904"
          if not before or set(before) == {"0"}:
              base = empty_tree
          else:
              base = before

          diff = subprocess.check_output(
              ["git", "diff", "--name-status", base, after],
              text=True
          )

          model_patterns = [
              re.compile(r"^src/main/resources/assets/([^/]+)/models/item/(.+)\.json$"),
              re.compile(r"^versions/1\.21\.8/src/generated/resources/assets/([^/]+)/models/item/(.+)\.json$"),
          ]

          blockstate_patterns = [
              re.compile(r"^src/main/resources/assets/([^/]+)/blockstates/(.+)\.json$"),
              re.compile(r"^versions/1\.21\.8/src/generated/resources/assets/([^/]+)/blockstates/(.+)\.json$"),
          ]

          model_ids = []
          blockstate_ids = []
          seen_models = set()
          seen_blockstates = set()

          for raw_line in diff.splitlines():
              parts = raw_line.split("\t")
              if not parts:
                  continue

              status = parts[0]

              # Ignore pure deletions
              if status.startswith("D"):
                  continue

              # For rename/copy, use destination path
              if (status.startswith("R") or status.startswith("C")) and len(parts) >= 3:
                  path = parts[2]
              elif len(parts) >= 2:
                  path = parts[1]
              else:
                  continue

              path = path.replace("\\", "/")

              # Only keep files that still exist in checked out HEAD
              if not os.path.exists(path):
                  continue

              matched = False

              for pattern in model_patterns:
                  m = pattern.match(path)
                  if m:
                      model_id = f"{m.group(1)}:item/{m.group(2)}"
                      if model_id not in seen_models:
                          seen_models.add(model_id)
                          model_ids.append(model_id)
                      matched = True
                      break

              if matched:
                  continue

              for pattern in blockstate_patterns:
                  m = pattern.match(path)
                  if m:
                      blockstate_id = f"{m.group(1)}:{m.group(2)}"
                      if blockstate_id not in seen_blockstates:
                          seen_blockstates.add(blockstate_id)
                          blockstate_ids.append(blockstate_id)
                      break

          models_file = runner_temp / "changed-model-ids.txt"
          blockstates_file = runner_temp / "changed-blockstate-ids.txt"

          models_file.write_text("\n".join(model_ids), encoding="utf-8")
          blockstates_file.write_text("\n".join(blockstate_ids), encoding="utf-8")

          has_targets = "true" if (model_ids or blockstate_ids) else "false"

          with output_path.open("a", encoding="utf-8") as f:
              f.write(f"has_targets={has_targets}\n")
              f.write(f"model_count={len(model_ids)}\n")
              f.write(f"blockstate_count={len(blockstate_ids)}\n")
          PY

      - name: Stop early when nothing relevant remains
        if: steps.detect.outputs.has_targets != 'true'
        run: echo "No added/modified/renamed direct item models or blockstates to report."

      - name: Send clean Discord webhook message
        if: steps.detect.outputs.has_targets == 'true'
        env:
          DISCORD_WEBHOOK: ${{ secrets.DISCORD_WEBHOOK }}
          MODEL_COUNT: ${{ steps.detect.outputs.model_count }}
          BLOCKSTATE_COUNT: ${{ steps.detect.outputs.blockstate_count }}
          REPOSITORY: ${{ github.repository }}
          BRANCH_NAME: ${{ github.ref_name }}
          COMMIT_SHA: ${{ github.sha }}
          COMMIT_URL: ${{ github.server_url }}/${{ github.repository }}/commit/${{ github.sha }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          node <<'EOF'
          const fs = require('fs');
          const https = require('https');
          const path = require('path');

          const webhook = (process.env.DISCORD_WEBHOOK || '').trim();
          if (!webhook) {
            console.error('DISCORD_WEBHOOK secret is missing or empty');
            process.exit(1);
          }

          let webhookUrl;
          try {
            webhookUrl = new URL(webhook);
          } catch (err) {
            console.error('DISCORD_WEBHOOK is not a valid URL');
            process.exit(1);
          }

          const runnerTemp = process.env.RUNNER_TEMP;
          const modelsPath = path.join(runnerTemp, 'changed-model-ids.txt');
          const blockstatesPath = path.join(runnerTemp, 'changed-blockstate-ids.txt');

          const models = fs.existsSync(modelsPath)
            ? fs.readFileSync(modelsPath, 'utf8').split(/\r?\n/).map(s => s.trim()).filter(Boolean)
            : [];

          const blockstates = fs.existsSync(blockstatesPath)
            ? fs.readFileSync(blockstatesPath, 'utf8').split(/\r?\n/).map(s => s.trim()).filter(Boolean)
            : [];

          function fieldValue(items, limit = 15) {
            if (!items.length) return 'None';
            const shown = items.slice(0, limit);
            let text = shown.map(item => `\`${item}\``).join('\n');
            const extra = items.length - shown.length;
            if (extra > 0) text += `\n… (+${extra} more)`;
            return text;
          }

          const shortSha = (process.env.COMMIT_SHA || '').slice(0, 7);

          const payload = {
            allowed_mentions: { parse: [] },
            embeds: [
              {
                title: 'Changed item models / blockstates detected',
                description:
                  `Repository: \`${process.env.REPOSITORY}\`\n` +
                  `Branch: \`${process.env.BRANCH_NAME}\`\n` +
                  `Commit: [\`${shortSha}\`](${process.env.COMMIT_URL})\n` +
                  `[Open workflow run](${process.env.RUN_URL})`,
                fields: [
                  {
                    name: `Direct item models (${process.env.MODEL_COUNT})`,
                    value: fieldValue(models),
                    inline: false
                  },
                  {
                    name: `Blockstates (${process.env.BLOCKSTATE_COUNT})`,
                    value: fieldValue(blockstates),
                    inline: false
                  }
                ]
              }
            ]
          };

          const body = JSON.stringify(payload);

          const options = {
            protocol: webhookUrl.protocol,
            hostname: webhookUrl.hostname,
            port: webhookUrl.port || (webhookUrl.protocol === 'https:' ? 443 : 80),
            path: webhookUrl.pathname + webhookUrl.search,
            method: 'POST',
            headers: {
              'Content-Type': 'application/json',
              'Content-Length': Buffer.byteLength(body)
            }
          };

          const req = https.request(options, (res) => {
            let responseBody = '';
            res.on('data', chunk => responseBody += chunk);
            res.on('end', () => {
              if (res.statusCode >= 200 && res.statusCode < 300) {
                console.log(`Discord webhook sent successfully (${res.statusCode})`);
                process.exit(0);
              } else {
                console.error(`Discord webhook failed (${res.statusCode})`);
                console.error(responseBody);
                process.exit(1);
              }
            });
          });

          req.on('error', (err) => {
            console.error('Discord webhook request error:', err);
            process.exit(1);
          });

          req.write(body);
          req.end();
          EOF