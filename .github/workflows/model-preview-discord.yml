name: Preview model changes in Discord

on:
  push:
    paths:
      - 'src/main/resources/assets/**/models/item/**/*.json'
      - 'src/main/resources/assets/**/models/block/**/*.json'
      - 'src/main/resources/assets/**/blockstates/**/*.json'
      - 'src/main/resources/assets/**/textures/**/*.png'
      - 'src/main/resources/assets/**/textures/**/*.jpg'
      - 'src/main/resources/assets/**/textures/**/*.jpeg'
      - 'src/main/resources/assets/**/textures/**/*.webp'
      - 'src/main/resources/assets/**/textures/**/*.mcmeta'
      - 'versions/*/src/generated/resources/assets/**/models/item/**/*.json'
      - 'versions/*/src/generated/resources/assets/**/models/block/**/*.json'
      - 'versions/*/src/generated/resources/assets/**/blockstates/**/*.json'
      - 'versions/*/src/generated/resources/assets/**/textures/**/*.png'
      - 'versions/*/src/generated/resources/assets/**/textures/**/*.jpg'
      - 'versions/*/src/generated/resources/assets/**/textures/**/*.jpeg'
      - 'versions/*/src/generated/resources/assets/**/textures/**/*.webp'
      - 'versions/*/src/generated/resources/assets/**/textures/**/*.mcmeta'
      - '.github/renderer-runner/**'
      - '.github/vendor/minecraft-model-renderer.tgz'
      - '.github/workflows/model-preview-discord.yml'

permissions:
  contents: read

concurrency:
  group: preview-model-changes-${{ github.ref }}
  cancel-in-progress: true

jobs:
  notify-discord:
    runs-on: ubuntu-latest
    env:
      DISCORD_WEBHOOK: ${{ secrets.DISCORD_WEBHOOK }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install native system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            python3 \
            make \
            g++ \
            pkg-config \
            xvfb \
            libx11-6 \
            libxext6 \
            libxi6 \
            libgl1-mesa-dri \
            libgl1-mesa-dev \
            libegl1-mesa-dev \
            libgles2-mesa-dev \
            libcairo2-dev \
            libpango1.0-dev \
            libjpeg-dev \
            libgif-dev \
            librsvg2-dev

      - name: Install renderer runner dependencies
        working-directory: .github/renderer-runner
        run: npm ci

      - name: Resolve changed render targets
        id: targets
        shell: bash
        env:
          GITHUB_EVENT_BEFORE: ${{ github.event.before }}
          GITHUB_SHA: ${{ github.sha }}
        run: |
          node <<'NODE'
          const fs = require("fs");
          const path = require("path");
          const cp = require("child_process");

          function normalize(p) {
            return p.replace(/\\/g, "/");
          }

          function exists(p) {
            return fs.existsSync(p);
          }

          function walkFiles(dir, predicate, result = []) {
            if (!exists(dir)) return result;
            for (const entry of fs.readdirSync(dir, { withFileTypes: true })) {
              const full = path.join(dir, entry.name);
              if (entry.isDirectory()) {
                walkFiles(full, predicate, result);
              } else if (entry.isFile() && predicate(normalize(full))) {
                result.push(normalize(full));
              }
            }
            return result;
          }

          function quoteMultilineOutput(name, value) {
            fs.appendFileSync(process.env.GITHUB_OUTPUT, `${name}<<EOF\n${value}\nEOF\n`);
          }

          const before = process.env.GITHUB_EVENT_BEFORE || "";
          const sha = process.env.GITHUB_SHA;

          let base = before;
          if (!base || /^0+$/.test(base)) {
            try {
              base = cp.execSync("git rev-parse HEAD^", { encoding: "utf8" }).trim();
            } catch {
              base = "";
            }
          }

          const changedFiles = (
            base
              ? cp.execSync(`git diff --name-only ${base} ${sha}`, { encoding: "utf8" })
              : cp.execSync("git ls-files", { encoding: "utf8" })
          )
            .split(/\r?\n/)
            .map(normalize)
            .filter(Boolean);

          const assetRoots = [];
          const mainRoot = "src/main/resources/assets";
          if (exists(mainRoot)) assetRoots.push(mainRoot);

          if (exists("versions")) {
            for (const versionDir of fs.readdirSync("versions", { withFileTypes: true })) {
              if (!versionDir.isDirectory()) continue;
              const root = normalize(
                path.join("versions", versionDir.name, "src/generated/resources/assets")
              );
              if (exists(root)) assetRoots.push(root);
            }
          }

          const rootSet = new Set(assetRoots.map(normalize));
          const modelIds = new Set();
          const blockstateIds = new Set();
          const changedTextureRefs = new Set();
          const changedModelRefs = new Set();

          function findAssetRoot(file) {
            const normalized = normalize(file);
            for (const root of rootSet) {
              if (normalized === root || normalized.startsWith(root + "/")) {
                return root;
              }
            }
            return null;
          }

          function relativeToRoot(file, root) {
            return normalize(path.relative(root, file));
          }

          function maybeAddDirectTarget(file) {
            const root = findAssetRoot(file);
            if (!root) return;

            const rel = relativeToRoot(file, root);

            let m = rel.match(/^([^/]+)\/models\/(item|block)\/(.+)\.json$/i);
            if (m) {
              const id = `${m[1]}:${m[2]}/${m[3]}`;
              modelIds.add(id);
              changedModelRefs.add(id);
              return;
            }

            m = rel.match(/^([^/]+)\/blockstates\/(.+)\.json$/i);
            if (m) {
              blockstateIds.add(`${m[1]}:${m[2]}`);
              return;
            }

            m = rel.match(/^([^/]+)\/textures\/(.+)\.(png|jpg|jpeg|webp)(?:\.mcmeta)?$/i);
            if (m) {
              changedTextureRefs.add(`${m[1]}:${m[2]}`);
            }
          }

          for (const file of changedFiles) {
            maybeAddDirectTarget(file);
          }

          const allModelJsonFiles = assetRoots.flatMap((root) =>
            walkFiles(root, (file) => /\/models\/(?:item|block)\/.+\.json$/i.test(file))
          );

          const allBlockstateJsonFiles = assetRoots.flatMap((root) =>
            walkFiles(root, (file) => /\/blockstates\/.+\.json$/i.test(file))
          );

          if (changedTextureRefs.size > 0) {
            const refs = [...changedTextureRefs];
            for (const file of allModelJsonFiles) {
              const raw = fs.readFileSync(file, "utf8");
              if (!refs.some((ref) => raw.includes(ref))) continue;

              const root = findAssetRoot(file);
              if (!root) continue;

              const rel = relativeToRoot(file, root);
              const m = rel.match(/^([^/]+)\/models\/(item|block)\/(.+)\.json$/i);
              if (!m) continue;

              const id = `${m[1]}:${m[2]}/${m[3]}`;
              modelIds.add(id);
            }
          }

          if (changedModelRefs.size > 0) {
            const refs = [...changedModelRefs];
            for (const file of allBlockstateJsonFiles) {
              const raw = fs.readFileSync(file, "utf8");
              if (!refs.some((ref) => raw.includes(ref))) continue;

              const root = findAssetRoot(file);
              if (!root) continue;

              const rel = relativeToRoot(file, root);
              const m = rel.match(/^([^/]+)\/blockstates\/(.+)\.json$/i);
              if (!m) continue;

              blockstateIds.add(`${m[1]}:${m[2]}`);
            }
          }

          const modelIdList = [...modelIds].sort();
          const blockstateIdList = [...blockstateIds].sort();
          const hasWork = modelIdList.length > 0 || blockstateIdList.length > 0;

          console.log("Changed files:");
          for (const file of changedFiles) console.log(`  - ${file}`);

          console.log("Asset roots:");
          for (const root of assetRoots) console.log(`  - ${root}`);

          console.log("Model IDs:");
          for (const id of modelIdList) console.log(`  - ${id}`);

          console.log("Blockstate IDs:");
          for (const id of blockstateIdList) console.log(`  - ${id}`);

          quoteMultilineOutput("asset_roots", assetRoots.join("\n"));
          quoteMultilineOutput("model_ids", modelIdList.join("\n"));
          quoteMultilineOutput("blockstate_ids", blockstateIdList.join("\n"));
          fs.appendFileSync(
            process.env.GITHUB_OUTPUT,
            `has_work=${hasWork ? "true" : "false"}\n`
          );
          NODE

      - name: Render queue GIF
        if: steps.targets.outputs.has_work == 'true'
        working-directory: .github/renderer-runner
        shell: bash
        env:
          ASSET_ROOTS: ${{ steps.targets.outputs.asset_roots }}
          MODEL_IDS: ${{ steps.targets.outputs.model_ids }}
          BLOCKSTATE_IDS: ${{ steps.targets.outputs.blockstate_ids }}
          LIBGL_ALWAYS_SOFTWARE: '1'
          MESA_GL_VERSION_OVERRIDE: '3.3'
        run: |
          set -euo pipefail

          mkdir -p out

          cmd=(
            npx minecraft-model-renderer
            render-queue
            --output "$GITHUB_WORKSPACE/.github/renderer-runner/out/queue.gif"
          )

          while IFS= read -r root; do
            [ -n "$root" ] || continue
            cmd+=(--assets-root "$GITHUB_WORKSPACE/$root")
          done <<< "$ASSET_ROOTS"

          while IFS= read -r id; do
            [ -n "$id" ] || continue
            cmd+=(--model-id "$id")
          done <<< "$MODEL_IDS"

          while IFS= read -r id; do
            [ -n "$id" ] || continue
            cmd+=(--blockstate-id "$id")
          done <<< "$BLOCKSTATE_IDS"

          printf 'Running command:\n'
          printf ' %q' "${cmd[@]}"
          printf '\n'

          xvfb-run -a -s "-ac -screen 0 1280x1024x24" "${cmd[@]}"

      - name: Upload preview artifact
        if: steps.targets.outputs.has_work == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: model-preview-gif
          path: .github/renderer-runner/out/queue.gif
          if-no-files-found: error

      - name: Post preview to Discord
        if: steps.targets.outputs.has_work == 'true' && env.DISCORD_WEBHOOK != ''
        shell: bash
        env:
          GITHUB_SERVER_URL: ${{ github.server_url }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          GITHUB_SHA: ${{ github.sha }}
          GITHUB_REF_NAME: ${{ github.ref_name }}
        run: |
          python3 <<'PY' > /tmp/discord-payload.json
          import json
          import os

          content = (
              f"Preview for {os.environ['GITHUB_REPOSITORY']} on {os.environ['GITHUB_REF_NAME']}\n"
              f"{os.environ['GITHUB_SERVER_URL']}/{os.environ['GITHUB_REPOSITORY']}/commit/{os.environ['GITHUB_SHA']}"
          )

          print(json.dumps({"content": content}))
          PY

          curl -sS -X POST "$DISCORD_WEBHOOK" \
            -F "payload_json=$(cat /tmp/discord-payload.json)" \
            -F "file1=@.github/renderer-runner/out/queue.gif;type=image/gif"

      - name: No matching render targets
        if: steps.targets.outputs.has_work != 'true'
        run: echo "No renderable model or blockstate targets were found for this push."