name: Preview model changes in Discord

on:
  push:
    paths:
      - 'src/main/resources/assets/**/models/item/**/*.json'
      - 'src/main/resources/assets/**/blockstates/**/*.json'
      - 'versions/1.21.8/src/generated/resources/assets/**/models/item/**/*.json'
      - 'versions/1.21.8/src/generated/resources/assets/**/blockstates/**/*.json'

jobs:
  notify-discord:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install native system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            python3 \
            make \
            g++ \
            pkg-config \
            xvfb \
            libx11-6 \
            libxext6 \
            libxi6 \
            libgl1-mesa-dri \
            libgl1-mesa-dev \
            libegl1-mesa-dev \
            libgles2-mesa-dev \
            libcairo2-dev \
            libpango1.0-dev \
            libjpeg-dev \
            libgif-dev \
            librsvg2-dev

      - name: Detect changed direct item models and blockstates
        id: detect
        env:
          BEFORE_SHA: ${{ github.event.before }}
          AFTER_SHA: ${{ github.sha }}
        run: |
          python <<'PY'
          import json
          import os
          import re
          import subprocess
          from pathlib import Path

          before = os.environ.get("BEFORE_SHA", "")
          after = os.environ["AFTER_SHA"]
          output_path = Path(os.environ["GITHUB_OUTPUT"])

          empty_tree = "4b825dc642cb6eb9a060e54bf8d69288fbee4904"
          base = empty_tree if (not before or set(before) == {"0"}) else before

          diff = subprocess.check_output(
              ["git", "diff", "--name-status", base, after],
              text=True
          )

          model_patterns = [
              re.compile(r"^src/main/resources/assets/([^/]+)/models/item/(.+)\.json$"),
              re.compile(r"^versions/1\.21\.8/src/generated/resources/assets/([^/]+)/models/item/(.+)\.json$"),
          ]

          blockstate_patterns = [
              re.compile(r"^src/main/resources/assets/([^/]+)/blockstates/(.+)\.json$"),
              re.compile(r"^versions/1\.21\.8/src/generated/resources/assets/([^/]+)/blockstates/(.+)\.json$"),
          ]

          model_ids = []
          blockstate_ids = []
          seen_models = set()
          seen_blockstates = set()

          for raw_line in diff.splitlines():
              parts = raw_line.split("\t")
              if not parts:
                  continue

              status = parts[0]

              if status.startswith("D"):
                  continue

              if (status.startswith("R") or status.startswith("C")) and len(parts) >= 3:
                  path = parts[2]
              elif len(parts) >= 2:
                  path = parts[1]
              else:
                  continue

              path = path.replace("\\", "/")

              if not os.path.exists(path):
                  continue

              matched = False

              for pattern in model_patterns:
                  m = pattern.match(path)
                  if m:
                      model_id = f"{m.group(1)}:item/{m.group(2)}"
                      if model_id not in seen_models:
                          seen_models.add(model_id)
                          model_ids.append(model_id)
                      matched = True
                      break

              if matched:
                  continue

              for pattern in blockstate_patterns:
                  m = pattern.match(path)
                  if m:
                      blockstate_id = f"{m.group(1)}:{m.group(2)}"
                      if blockstate_id not in seen_blockstates:
                          seen_blockstates.add(blockstate_id)
                          blockstate_ids.append(blockstate_id)
                      break

          has_targets = "true" if (model_ids or blockstate_ids) else "false"

          with output_path.open("a", encoding="utf-8") as f:
              f.write(f"has_targets={has_targets}\n")
              f.write(f"model_ids_json={json.dumps(model_ids, ensure_ascii=False)}\n")
              f.write(f"blockstate_ids_json={json.dumps(blockstate_ids, ensure_ascii=False)}\n")
              f.write(f"model_count={len(model_ids)}\n")
              f.write(f"blockstate_count={len(blockstate_ids)}\n")

          print("Detected model ids:", model_ids)
          print("Detected blockstate ids:", blockstate_ids)
          PY

      - name: Stop early when nothing relevant remains
        if: steps.detect.outputs.has_targets != 'true'
        run: echo "No added/modified/renamed direct item models or blockstates to render."

      - name: Restore cached renderer runner
        if: steps.detect.outputs.has_targets == 'true'
        id: cache-runner
        uses: actions/cache@v4
        with:
          path: .github/renderer-runner/node_modules
          key: ${{ runner.os }}-renderer-runner-${{ hashFiles('.github/renderer-runner/package-lock.json', '.github/vendor/item-model-renderer.tgz') }}

      - name: Install renderer runner dependencies
        if: steps.detect.outputs.has_targets == 'true' && steps.cache-runner.outputs.cache-hit != 'true'
        run: npm ci --prefix .github/renderer-runner

      - name: Render and send GIF batches to Discord with no text
        if: steps.detect.outputs.has_targets == 'true'
        env:
          DISCORD_WEBHOOK: ${{ secrets.DISCORD_WEBHOOK }}
          MODEL_IDS_JSON: ${{ steps.detect.outputs.model_ids_json }}
          BLOCKSTATE_IDS_JSON: ${{ steps.detect.outputs.blockstate_ids_json }}
        run: |
          set -euo pipefail

          BATCH_DIR="$RUNNER_TEMP/gif-batches"
          SAFE_MAX_BYTES=9500000
          BATCH_SIZE=6

          mkdir -p "$BATCH_DIR"

          export BATCH_DIR
          export MODEL_IDS_JSON
          export BLOCKSTATE_IDS_JSON
          export BATCH_SIZE

          python <<'PY'
          import json
          import os
          from pathlib import Path

          batch_dir = Path(os.environ["BATCH_DIR"])
          batch_size = int(os.environ["BATCH_SIZE"])

          entries = []

          for model_id in json.loads(os.environ.get("MODEL_IDS_JSON", "[]")):
              if model_id:
                  entries.append({"kind": "model", "id": model_id})

          for blockstate_id in json.loads(os.environ.get("BLOCKSTATE_IDS_JSON", "[]")):
              if blockstate_id:
                  entries.append({"kind": "blockstate", "id": blockstate_id})

          if not entries:
              raise SystemExit("No model/blockstate ids were provided.")

          for index in range(0, len(entries), batch_size):
              chunk = entries[index:index + batch_size]
              batch_path = batch_dir / f"batch_{index // batch_size + 1:03d}.json"
              batch_path.write_text(json.dumps(chunk, ensure_ascii=False), encoding="utf-8")

          print(f"Created {len(list(batch_dir.glob('batch_*.json')))} batch file(s).")
          PY

          render_batch () {
            local batch_json="$1"
            local out_gif="$2"
            local image_size="$3"
            local frame_count="$4"
            local max_columns="$5"
            local frame_delay_ms="$6"

            local entry_tsv="$RUNNER_TEMP/entries.tsv"
            rm -f "$out_gif" "$entry_tsv"

            BATCH_JSON="$batch_json" ENTRY_TSV="$entry_tsv" python <<'PY'
          import json
          import os
          from pathlib import Path

          batch_json = Path(os.environ["BATCH_JSON"])
          entry_tsv = Path(os.environ["ENTRY_TSV"])

          items = json.loads(batch_json.read_text(encoding="utf-8"))

          lines = []
          for item in items:
              kind = item["kind"]
              value = item["id"]
              lines.append(f"{kind}\t{value}")

          entry_tsv.write_text("\n".join(lines) + "\n", encoding="utf-8")
          PY

            ARGS=(
              render-queue
              --assets-root "src/main/resources/assets"
              --assets-root "versions/1.21.8/src/generated/resources/assets"
              --output "$out_gif"
              --image-size "$image_size"
              --frame-count "$frame_count"
              --max-columns "$max_columns"
              --frame-delay-ms "$frame_delay_ms"
            )

            while IFS=$'\t' read -r kind value; do
              if [ -z "${kind:-}" ] || [ -z "${value:-}" ]; then
                continue
              fi

              if [ "$kind" = "model" ]; then
                ARGS+=(--model-id "$value")
              elif [ "$kind" = "blockstate" ]; then
                ARGS+=(--blockstate-id "$value")
              else
                echo "Unknown batch entry kind: $kind"
                exit 1
              fi
            done < "$entry_tsv"

            echo "Final renderer args:"
            printf '  %s\n' "${ARGS[@]}"

            xvfb-run -a -s "-ac -screen 0 1280x1024x24" \
              node ./.github/renderer-runner/node_modules/@iskallia-dev/item-model-renderer/dist/lib/node/cli.js "${ARGS[@]}"

            test -f "$out_gif"
          }

          upload_one () {
            local file_path="$1"

            FILE_TO_SEND="$file_path" DISCORD_WEBHOOK="$DISCORD_WEBHOOK" node <<'EOF'
          const fs = require('fs');
          const https = require('https');
          const path = require('path');

          const webhook = (process.env.DISCORD_WEBHOOK || '').trim();
          const filePath = process.env.FILE_TO_SEND;

          if (!webhook) {
            console.error('DISCORD_WEBHOOK secret is missing or empty');
            process.exit(1);
          }

          if (!filePath || !fs.existsSync(filePath)) {
            console.error('GIF file does not exist:', filePath);
            process.exit(1);
          }

          let webhookUrl;
          try {
            webhookUrl = new URL(webhook);
          } catch {
            console.error('DISCORD_WEBHOOK is not a valid URL');
            process.exit(1);
          }

          const attachmentName = path.basename(filePath);
          const gifBuffer = fs.readFileSync(filePath);
          const boundary = '----DiscordBoundary' + Math.random().toString(16).slice(2);

          const payload = JSON.stringify({
            allowed_mentions: { parse: [] },
            embeds: [
              {
                image: {
                  url: `attachment://${attachmentName}`
                }
              }
            ]
          });

          const preamble =
            `--${boundary}\r\n` +
            `Content-Disposition: form-data; name="payload_json"\r\n` +
            `Content-Type: application/json\r\n\r\n` +
            payload + `\r\n` +
            `--${boundary}\r\n` +
            `Content-Disposition: form-data; name="files[0]"; filename="${attachmentName}"\r\n` +
            `Content-Type: image/gif\r\n\r\n`;

          const closing = `\r\n--${boundary}--\r\n`;

          const body = Buffer.concat([
            Buffer.from(preamble, 'utf8'),
            gifBuffer,
            Buffer.from(closing, 'utf8')
          ]);

          const options = {
            protocol: webhookUrl.protocol,
            hostname: webhookUrl.hostname,
            port: webhookUrl.port || (webhookUrl.protocol === 'https:' ? 443 : 80),
            path: webhookUrl.pathname + webhookUrl.search,
            method: 'POST',
            headers: {
              'Content-Type': `multipart/form-data; boundary=${boundary}`,
              'Content-Length': body.length
            }
          };

          const req = https.request(options, (res) => {
            let responseBody = '';
            res.on('data', chunk => responseBody += chunk);
            res.on('end', () => {
              if (res.statusCode >= 200 && res.statusCode < 300) {
                console.log(`Discord webhook sent successfully (${res.statusCode})`);
                process.exit(0);
              } else {
                console.error(`Discord webhook failed (${res.statusCode})`);
                console.error(responseBody);
                process.exit(1);
              }
            });
          });

          req.on('error', (err) => {
            console.error('Discord webhook request error:', err);
            process.exit(1);
          });

          req.write(body);
          req.end();
          EOF
          }

          shopt -s nullglob
          BATCH_FILES=("$BATCH_DIR"/batch_*.json)

          if [ "${#BATCH_FILES[@]}" -eq 0 ]; then
            echo "No batch files were produced."
            exit 1
          fi

          batch_number=0
          for batch_json in "${BATCH_FILES[@]}"; do
            batch_number=$((batch_number + 1))
            out_gif="$RUNNER_TEMP/queue_batch_${batch_number}.gif"

            echo "=== Rendering batch $batch_number: $batch_json ==="

            render_batch "$batch_json" "$out_gif" 128 36 5 60
            size_bytes=$(stat -c%s "$out_gif")
            echo "Batch $batch_number size after first render: $size_bytes bytes"

            if [ "$size_bytes" -gt "$SAFE_MAX_BYTES" ]; then
              echo "Batch $batch_number too large, retrying smaller..."
              render_batch "$batch_json" "$out_gif" 96 24 4 70
              size_bytes=$(stat -c%s "$out_gif")
              echo "Batch $batch_number size after second render: $size_bytes bytes"
            fi

            if [ "$size_bytes" -gt "$SAFE_MAX_BYTES" ]; then
              echo "Batch $batch_number still too large, retrying even smaller..."
              render_batch "$batch_json" "$out_gif" 80 18 3 80
              size_bytes=$(stat -c%s "$out_gif")
              echo "Batch $batch_number size after third render: $size_bytes bytes"
            fi

            if [ "$size_bytes" -gt "$SAFE_MAX_BYTES" ]; then
              echo "Batch $batch_number is still too large after all retries: $size_bytes bytes"
              echo "Lower BATCH_SIZE or shrink render settings further."
              exit 1
            fi

            upload_one "$out_gif"
          done