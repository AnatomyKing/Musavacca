name: Preview model changes in epic rotating gif format

on:
  push:
    paths:
      - 'src/main/resources/assets/**/models/item/**/*.json'
      - 'src/main/resources/assets/**/blockstates/**/*.json'
      - 'versions/1.21.8/src/generated/resources/assets/**/models/item/**/*.json'
      - 'versions/1.21.8/src/generated/resources/assets/**/blockstates/**/*.json'

jobs:
  notify-discord:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    env:
      RENDERER_TGZ: ${{ github.workspace }}/.github/vendor/iskallia-dev-item-model-renderer-2.0.0.tgz
      ROOT_ONE: src/main/resources/assets
      ROOT_TWO: versions/1.21.8/src/generated/resources/assets

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install native dependencies for canvas
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            libcairo2-dev \
            libpango1.0-dev \
            libjpeg-dev \
            libgif-dev \
            librsvg2-dev

      - name: Detect changed direct item models and blockstates
        id: detect
        env:
          BEFORE_SHA: ${{ github.event.before }}
          AFTER_SHA: ${{ github.sha }}
        run: |
          python <<'PY'
          import os
          import re
          import subprocess
          from pathlib import Path

          before = os.environ.get("BEFORE_SHA", "")
          after = os.environ["AFTER_SHA"]
          runner_temp = Path(os.environ["RUNNER_TEMP"])
          output_path = Path(os.environ["GITHUB_OUTPUT"])

          empty_tree = "4b825dc642cb6eb9a060e54bf8d69288fbee4904"
          if not before or set(before) == {"0"}:
              base = empty_tree
          else:
              base = before

          diff = subprocess.check_output(
              ["git", "diff", "--name-status", base, after],
              text=True
          )

          model_patterns = [
              re.compile(r"^src/main/resources/assets/([^/]+)/models/item/(.+)\.json$"),
              re.compile(r"^versions/1\.21\.8/src/generated/resources/assets/([^/]+)/models/item/(.+)\.json$"),
          ]

          blockstate_patterns = [
              re.compile(r"^src/main/resources/assets/([^/]+)/blockstates/(.+)\.json$"),
              re.compile(r"^versions/1\.21\.8/src/generated/resources/assets/([^/]+)/blockstates/(.+)\.json$"),
          ]

          model_ids = []
          blockstate_ids = []
          seen_models = set()
          seen_blockstates = set()

          for raw_line in diff.splitlines():
              parts = raw_line.split("\t")
              if not parts:
                  continue

              status = parts[0]

              if status.startswith("D"):
                  continue

              if (status.startswith("R") or status.startswith("C")) and len(parts) >= 3:
                  path = parts[2]
              elif len(parts) >= 2:
                  path = parts[1]
              else:
                  continue

              path = path.replace("\\", "/")

              if not os.path.exists(path):
                  continue

              matched = False

              for pattern in model_patterns:
                  m = pattern.match(path)
                  if m:
                      model_id = f"{m.group(1)}:item/{m.group(2)}"
                      if model_id not in seen_models:
                          seen_models.add(model_id)
                          model_ids.append(model_id)
                      matched = True
                      break

              if matched:
                  continue

              for pattern in blockstate_patterns:
                  m = pattern.match(path)
                  if m:
                      blockstate_id = f"{m.group(1)}:{m.group(2)}"
                      if blockstate_id not in seen_blockstates:
                          seen_blockstates.add(blockstate_id)
                          blockstate_ids.append(blockstate_id)
                      break

          models_file = runner_temp / "changed-model-ids.txt"
          blockstates_file = runner_temp / "changed-blockstate-ids.txt"

          models_file.write_text("\n".join(model_ids), encoding="utf-8")
          blockstates_file.write_text("\n".join(blockstate_ids), encoding="utf-8")

          has_targets = "true" if (model_ids or blockstate_ids) else "false"

          with output_path.open("a", encoding="utf-8") as f:
              f.write(f"has_targets={has_targets}\n")
              f.write(f"model_count={len(model_ids)}\n")
              f.write(f"blockstate_count={len(blockstate_ids)}\n")
          PY

      - name: Stop early when nothing relevant remains
        if: steps.detect.outputs.has_targets != 'true'
        run: echo "No added/modified/renamed direct item models or blockstates to report."

      - name: Install local renderer tarball
        if: steps.detect.outputs.has_targets == 'true'
        run: |
          test -f "$RENDERER_TGZ"
          mkdir -p "$RUNNER_TEMP/renderer-install"
          cd "$RUNNER_TEMP/renderer-install"
          npm init -y >/dev/null 2>&1
          npm install --no-save "$RENDERER_TGZ"

      - name: Send clean Discord webhook message
        if: steps.detect.outputs.has_targets == 'true'
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          MODEL_COUNT: ${{ steps.detect.outputs.model_count }}
          BLOCKSTATE_COUNT: ${{ steps.detect.outputs.blockstate_count }}
          REPOSITORY: ${{ github.repository }}
          BRANCH_NAME: ${{ github.ref_name }}
          COMMIT_SHA: ${{ github.sha }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          python <<'PY'
          import json
          import os
          from pathlib import Path

          runner_temp = Path(os.environ["RUNNER_TEMP"])
          models = [line.strip() for line in (runner_temp / "changed-model-ids.txt").read_text(encoding="utf-8").splitlines() if line.strip()]
          blockstates = [line.strip() for line in (runner_temp / "changed-blockstate-ids.txt").read_text(encoding="utf-8").splitlines() if line.strip()]

          def field_value(items, limit=15):
              if not items:
                  return "None"
              shown = items[:limit]
              text = "\n".join(f"`{item}`" for item in shown)
              extra = len(items) - len(shown)
              if extra > 0:
                  text += f"\n… (+{extra} more)"
              return text

          short_sha = os.environ["COMMIT_SHA"][:7]

          payload = {
              "allowed_mentions": {
                  "parse": []
              },
              "embeds": [
                  {
                      "title": "Changed item models / blockstates detected",
                      "description": (
                          f"Repository: `{os.environ['REPOSITORY']}`\n"
                          f"Branch: `{os.environ['BRANCH_NAME']}`\n"
                          f"Commit: `{short_sha}`\n"
                          f"[Open workflow run]({os.environ['RUN_URL']})"
                      ),
                      "fields": [
                          {
                              "name": f"Direct item models ({os.environ['MODEL_COUNT']})",
                              "value": field_value(models),
                              "inline": False
                          },
                          {
                              "name": f"Blockstates ({os.environ['BLOCKSTATE_COUNT']})",
                              "value": field_value(blockstates),
                              "inline": False
                          }
                      ]
                  }
              ]
          }

          Path("discord-payload.json").write_text(
              json.dumps(payload, ensure_ascii=False),
              encoding="utf-8"
          )
          PY

          curl --fail-with-body \
            -H "Content-Type: application/json" \
            -X POST \
            -d @discord-payload.json \
            "$DISCORD_WEBHOOK_URL"