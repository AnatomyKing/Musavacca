name: Discord model previews

on:
  push:
    branches:
      - '**'
    paths:
      - 'src/main/resources/assets/**/models/item/**/*.json'
      - '.github/workflows/discord-model-previews.yml'
      - 'astro/package.json'
      - 'astro/package-lock.json'
      - 'astro/astro.config.mjs'
      - 'astro/tsconfig.json'
      - 'astro/render.mjs'
      - 'astro/src/pages/model-preview.astro'
      - 'astro/src/components/ModelPreviewApp.jsx'

jobs:
  send-previews:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    defaults:
      run:
        working-directory: astro

    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: astro/package-lock.json

      - name: Install packages
        run: npm ci

      - name: Install Playwright Chromium
        run: npx playwright install chromium --with-deps

      - name: Render and send previews
        env:
          DISCORD_WEBHOOK: ${{ secrets.DISCORD_WEBHOOK }}
          PREVIEW_URL: http://127.0.0.1:4321/model-preview
        run: |
          npm run dev -- --host 127.0.0.1 --port 4321 &
          SERVER_PID=$!
          trap "kill $SERVER_PID" EXIT
          npm run send-model-previews

      - name: Upload preview images
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: model-previews
          path: astro/artifacts/
          retention-days: 7